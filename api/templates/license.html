<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivasi Lisensi - Lancar Dynamic Admin</title>
    <link rel="stylesheet" href="/static/vendor/css/inter.css">
    <link rel="stylesheet" href="/static/vendor/css/all.min.css">
    <style>
        :root {
            --primary: #0f766e;
            --primary-strong: #0b5f59;
            --text: #0f172a;
            --muted: #64748b;
            --line: #dbe7e4;
            --surface: #ffffff;
            --soft: #f1faf7;
            --danger: #b42318;
            --danger-bg: #fff1f0;
            --success: #067647;
            --success-bg: #ecfdf3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                linear-gradient(180deg, rgba(15, 118, 110, .08), rgba(255, 255, 255, 0) 42%),
                #f8fbfa;
            display: grid;
            place-items: center;
            padding: 28px;
        }

        .license-shell {
            width: min(920px, 100%);
            display: grid;
            grid-template-columns: .9fr 1.1fr;
            gap: 22px;
            align-items: stretch;
        }

        .license-panel,
        .license-form-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 18px 48px rgba(15, 23, 42, .08);
        }

        .license-panel {
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 430px;
        }

        .brand-mark {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: var(--soft);
            color: var(--primary);
            display: grid;
            place-items: center;
            font-size: 20px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.16;
            letter-spacing: 0;
        }

        p {
            color: var(--muted);
            line-height: 1.58;
            margin: 12px 0 0;
            font-size: 14px;
        }

        .status-box {
            margin-top: 22px;
            padding: 13px 14px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #f8fafc;
            font-size: 13px;
            color: var(--muted);
        }

        .status-box.success {
            border-color: #abefc6;
            background: var(--success-bg);
            color: var(--success);
        }

        .status-box.danger {
            border-color: #fecdca;
            background: var(--danger-bg);
            color: var(--danger);
        }

        .license-form-card {
            padding: 28px;
        }

        .form-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-title h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 0;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 12px;
            font: inherit;
            color: var(--text);
            background: #fff;
        }

        input:focus {
            outline: 2px solid rgba(15, 118, 110, .18);
            border-color: var(--primary);
        }

        button {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        button:hover {
            background: var(--primary-strong);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .72;
        }

        .message {
            min-height: 20px;
            margin: 12px 0;
            font-size: 13px;
            line-height: 1.5;
            color: var(--muted);
        }

        .message.error {
            color: var(--danger);
        }

        .message.success {
            color: var(--success);
        }

        .meta-list {
            display: grid;
            gap: 8px;
            margin-top: 18px;
            font-size: 12px;
            color: var(--muted);
        }

        .meta-list span {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #edf2f7;
        }

        .meta-list strong {
            color: #334155;
            font-weight: 700;
        }

        @media (max-width: 760px) {
            body {
                padding: 16px;
            }

            .license-shell {
                grid-template-columns: 1fr;
            }

            .license-panel {
                min-height: auto;
            }
        }
    </style>
</head>

<body>
    <main class="license-shell">
        <section class="license-panel">
            <div>
                <div class="brand-mark" aria-hidden="true">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>Aktivasi Lisensi Aplikasi</h1>
                <p>Masukkan Clinic ID dan kode lisensi dari server lisensi. Setelah valid, aplikasi akan membuka
                    dashboard utama.</p>
                <div id="license-status" class="status-box">
                    <i class="fas fa-circle-notch fa-spin"></i>
                    Memeriksa status lisensi...
                </div>
            </div>
            <div class="meta-list" aria-label="Informasi lisensi">
                <span><strong>Clinic ID</strong><em id="meta-clinic-id">-</em></span>
                <span><strong>Status</strong><em id="meta-status">-</em></span>
                <span><strong>Expired</strong><em id="meta-expired">-</em></span>
            </div>
        </section>

        <section class="license-form-card">
            <div class="form-title">
                <h2>Verifikasi Lisensi</h2>
                <i class="fas fa-key" aria-hidden="true"></i>
            </div>
            <form id="license-form">
                <div class="field">
                    <label for="clinic-id">Clinic ID</label>
                    <input id="clinic-id" name="clinic_id" type="text" autocomplete="off" required>
                </div>
                <div class="field">
                    <label for="license-key">Kode Lisensi</label>
                    <input id="license-key" name="license_key" type="password" autocomplete="off" required>
                </div>
                <div id="license-message" class="message"></div>
                <button id="license-submit" type="submit">
                    <i class="fas fa-check-circle"></i>
                    Aktivasi Lisensi
                </button>
            </form>
        </section>
    </main>

    <script id="app-config" type="application/json">{{ {"appToken": app_token, "license": license} | tojson }}</script>
    <script>
        (function () {
            const config = JSON.parse(document.getElementById('app-config').textContent);
            window._appToken = config.appToken;
            window._initialLicense = config.license;
        })();
    </script>
    <script src="/static/modules/license.js?v={{ cache_buster | default(1) }}"></script>
</body>

</html>
